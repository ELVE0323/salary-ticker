<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="num2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3ddc97"/>
    </linearGradient>
  </defs>

  <!-- maskable：主体必须缩在中间 80% 安全区内 -->
  <rect width="512" height="512" fill="url(#bg2)"/>

  <g transform="translate(256,256) scale(0.66) translate(-256,-256)">
    <text x="256" y="252" font-family="SF Mono,Consolas,monospace" font-size="140" font-weight="700"
          fill="url(#num2)" text-anchor="middle">¥</text>
    <polyline points="120,340 190,340 244,294 298,308 352,266 400,266"
              fill="none" stroke="url(#bar2)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="120" y="360" width="280" height="20" rx="10" fill="#ffffff" opacity=".08"/>
    <rect x="120" y="360" width="184" height="20" rx="10" fill="url(#bar2)"/>
  </g>
</svg>