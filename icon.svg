<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111823"/>
      <stop offset="55%" stop-color="#0d1219"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3ddc97"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- 顶部扫描灯带 -->
  <rect x="110" y="60" width="292" height="5" rx="2.5" fill="url(#num)" opacity=".9"/>

  <!-- ¥ 符号 -->
  <g opacity=".95">
    <text x="256" y="248" font-family="SF Mono,Consolas,monospace" font-size="132" font-weight="700"
          fill="url(#num)" text-anchor="middle">¥</text>
  </g>

  <!-- 上升折线 -->
  <polyline points="96,392 176,392 236,336 296,352 356,304 416,304"
            fill="none" stroke="url(#bar)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 进度条 -->
  <rect x="96" y="416" width="320" height="22" rx="11" fill="#ffffff" opacity=".08"/>
  <rect x="96" y="416" width="212" height="22" rx="11" fill="url(#bar)"/>
  <circle cx="308" cy="427" r="15" fill="#0d1219" stroke="#3ddc97" stroke-width="5"/>

  <!-- 秒表点缀 -->
  <circle cx="398" cy="160" r="9" fill="#3ddc97" opacity=".9"/>
  <circle cx="430" cy="190" r="5" fill="#7dd3fc" opacity=".7"/>
</svg>